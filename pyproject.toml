[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-results"
version = "0.1.0"
description = "Explicit private result capture and byte-bounded snapshots"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
