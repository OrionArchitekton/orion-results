name: private-candidate-core
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core-and-artifacts:
    name: core-and-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install locked development tools
        run: |
          mkdir -m 700 .private
          python -m venv .venv-build
          python -m venv .venv-test
          .venv-build/bin/python -m pip install --require-hashes -r build-requirements.lock
          .venv-test/bin/python -m pip install --require-hashes -r dev-requirements.lock
      - name: Verify installed package and archives
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --check "$HEAD_SHA"
          fi
          node tools/check_ci_gate.mjs
          python tools/check.py --phase ci-full
          .venv-test/bin/python -I examples/capture_results.py
